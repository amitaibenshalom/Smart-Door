<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>amitaibenshalom.com</title>
        <meta
            name="description"
            content="Amitai Ben Shalom's website is currently being updated."
        />
        <style>
            :root {
                color-scheme: light;
                --bg: #f7f3ea;
                --ink: #202124;
                --muted: #5f6368;
                --accent: #1f7a6d;
                --line: rgba(32, 33, 36, 0.14);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family:
                    Inter, ui-sans-serif, system-ui, -apple-system,
                    BlinkMacSystemFont, "Segoe UI", sans-serif;
                color: var(--ink);
                background:
                    radial-gradient(circle at 20% 20%, #ffffff 0, transparent 32%),
                    linear-gradient(135deg, #f7f3ea 0%, #dcebe7 52%, #f4d9cf 100%);
                display: grid;
                place-items: center;
                padding: 32px;
            }

            main {
                width: min(100%, 720px);
                padding: clamp(32px, 8vw, 72px);
                border: 1px solid var(--line);
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.68);
                box-shadow: 0 24px 80px rgba(32, 33, 36, 0.12);
            }

            .eyebrow {
                margin: 0 0 18px;
                color: var(--accent);
                font-size: 0.86rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                max-width: 11ch;
                font-size: clamp(2.6rem, 8vw, 5.8rem);
                line-height: 0.94;
                font-weight: 800;
                letter-spacing: 0;
            }

            p {
                margin: 28px 0 0;
                max-width: 58ch;
                color: var(--muted);
                font-size: clamp(1.05rem, 2vw, 1.25rem);
                line-height: 1.6;
            }

            .signature {
                margin-top: 34px;
                color: var(--ink);
                font-weight: 700;
            }

            a {
                color: var(--accent);
                text-decoration-thickness: 2px;
                text-underline-offset: 4px;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="eyebrow">amitaibenshalom.com</p>
            <h1>Working on something new.</h1>
            <p>
                This website is getting a thoughtful refresh. The smart-door
                backend is still running quietly behind the scenes, and the
                public site will be back with a cleaner home soon.
            </p>
            <p class="signature">Thanks for stopping by, Amitai</p>
        </main>
    </body>
</html>
